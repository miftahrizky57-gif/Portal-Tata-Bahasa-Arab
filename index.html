<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Tatabahasa</title>
    <script>
      // Filter out benign Vite HMR WebSocket connection logs in sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('websocket') || event.reason.message.includes('vite'))) ||
          String(event.reason).includes('WebSocket closed') ||
          String(event.reason).includes('failed to connect to websocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('websocket') ||
          event.message.includes('failed to connect') ||
          event.message.includes('[vite]')
        )) {
          event.preventDefault();
        }
      }, true);
      const _origErr = console.error;
      console.error = function(...args) {
        const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
        if (msg.includes('WebSocket') || msg.includes('failed to connect to websocket') || msg.includes('[vite]')) {
          return;
        }
        _origErr.apply(console, args);
      };
      const _origWarn = console.warn;
      console.warn = function(...args) {
        const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
        if (msg.includes('WebSocket') || msg.includes('failed to connect to websocket') || msg.includes('[vite]')) {
          return;
        }
        _origWarn.apply(console, args);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
